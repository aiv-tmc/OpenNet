[package]
name = "opennet"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
blake3 = "1.5"
bytes = { version = "1", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
socket2 = "0.5"
